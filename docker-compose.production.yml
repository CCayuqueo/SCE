services:
  database:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Define el origen HTTPS público de SRC}

  frontend:
    restart: unless-stopped
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SRC_TLS_DIR:?Define el directorio del certificado}:/etc/nginx/tls:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
