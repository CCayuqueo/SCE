name: CI
on: [push, pull_request]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: src
          POSTGRES_DB: src_test
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U src -d src_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest
      - name: Verificar el esquema con PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://src:ci-only-not-a-secret@127.0.0.1:${{ job.services.postgres.ports[5432] }}/src_test
        run: |
          alembic upgrade head
          alembic check
          pytest -m integration
      - run: python ../horario_parser.py ../images > /dev/null

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configurar contraseña efímera para PostgreSQL
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
      - run: docker compose up --build --wait --wait-timeout 120
      - name: Verificar proxy, PostgreSQL y migración inicial
        run: |
          curl --fail --silent --show-error http://localhost:3000/ | grep '<title>SRC</title>'
          curl --fail --silent --show-error http://localhost:3000/api/v1/health/live | grep '"status":"ok"'
          curl --fail --silent --show-error http://localhost:3000/api/v1/health/ready | grep '"status":"ok"'
          docker compose exec -T backend alembic current | grep '(head)'
          docker compose exec -T backend alembic check
      - name: Verificar compatibilidad del parser en la imagen Python
        run: |
          docker compose run --rm --no-deps \
            -v "$PWD/images:/parser/images:ro" \
            backend python -c '
          from pathlib import Path
          from app.core.config import Settings
          from app.image_processing.adapter import ImageProcessor

          files = sorted(Path("/parser/images").glob("*.png"))
          processor = ImageProcessor(Settings())
          counts = [sum(cell.is_occupied for cell in processor.process(file.read_bytes())) for file in files]
          assert counts == [15, 17, 17, 16, 13, 18], counts
          '
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
